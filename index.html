<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulasi Pemilihan Kepala Desa</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; font-family: Arial, sans-serif; background: #eef4fa; color: #17243b; }
    header { position: relative; background: #0b3c95; color: white; padding: 16px 140px; text-align: center; font-weight: bold; letter-spacing: .04em; }
    main { width: 100%; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: clamp(8px, 2vh, 24px) clamp(12px, 3vw, 36px); }
    .panel { width: min(100%, 1200px); text-align: center; }
    h1 { color: #0b3c95; margin: 0 0 8px; font-size: clamp(20px, 3vw, 36px); text-transform: uppercase; }
    .panel > p { margin: 0; color: #536378; }
    #standby { display: flex; flex-direction: column; align-items: center; max-height: 100%; }
    #reader { width: min(100%, 520px, 55vh); margin: clamp(8px, 2vh, 20px) auto; overflow: hidden; border-radius: 12px; background: #e2e8f0; }
    #reader video { width: 100% !important; height: auto; max-height: 55vh; object-fit: contain; }
    #status { line-height: 1.5; margin: 14px 0; }
    .error { color: #b02a37; }
    button { border: 0; border-radius: 8px; padding: 13px 20px; font-size: 16px; font-weight: bold; cursor: pointer; background: #0b3c95; color: white; }
    button:focus-visible { outline: 3px solid #f4a926; outline-offset: 3px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .secondary { background: #52647a; }
    .fullscreen { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); padding: 8px 12px; font-size: 12px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.55); }
    #voting { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 0; }
    .candidates { width: 100%; flex: 1; max-height: min(62vh, var(--grid-max-height, 400px)); min-height: 0; display: grid; grid-template-columns: repeat(var(--columns, 3), minmax(0, 1fr)); grid-template-rows: repeat(var(--rows, 1), minmax(0, 1fr)); gap: 12px; margin: clamp(8px, 2vh, 20px) auto; }
    .candidate { display: flex; flex-direction: column; min-width: 0; min-height: 0; width: 100%; padding: 0; overflow: hidden; background: white; color: #17243b; border: 3px solid #293a4f; border-radius: 4px; box-shadow: 0 5px 15px rgba(24,43,66,.1); }
    .candidate.selected { border-color: #198754; box-shadow: 0 0 0 4px rgba(25,135,84,.2); }
    .candidate-number { width: 100%; padding: 6px; font-size: clamp(20px, 2.4vw, 28px); border-bottom: 2px solid #293a4f; }
    .candidate-photo, .placeholder { display: block; width: 100%; background: #e0e7ef; }
    .candidate > .candidate-photo, .candidate > .placeholder { flex: 1; min-height: 0; height: 100%; object-fit: contain; }
    .placeholder { display: grid; place-items: center; color: #64748b; font-size: 14px; }
    .candidate-name { width: 100%; min-height: 36px; display: grid; place-items: center; padding: 5px; border-top: 2px solid #293a4f; overflow-wrap: anywhere; font-size: clamp(12px, 1.5vw, 16px); }
    #choose { width: min(100%, 640px); background: #bd2735; }
    .overlay { position: fixed; inset: 0; background: rgba(10,22,40,.72); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
    .modal { background: white; border-radius: 16px; padding: clamp(18px, 3vh, 28px); max-width: 480px; width: 100%; max-height: calc(100dvh - 32px); overflow-y: auto; text-align: center; box-shadow: 0 18px 60px rgba(0,0,0,.25); }
    .modal h2 { margin: 0 0 8px; color: #0b3c95; }
    .modal p { margin: 10px 0; }
    .modal-photo { width: min(180px, 25vh); height: min(220px, 30vh); margin: 8px auto; border: 2px solid #dce3ed; border-radius: 8px; overflow: hidden; }
    .modal-photo .candidate-photo, .modal-photo .placeholder { width: 100%; height: 100%; object-fit: contain; }
    .result-qr { width: min(180px, 30vh); margin: 8px auto; padding: 8px; background: white; }
    .result-qr img, .result-qr canvas { display: block; width: 100% !important; height: auto !important; }
    .success-icon { width: 64px; height: 64px; margin: 0 auto 12px; display: grid; place-items: center; border-radius: 50%; background: #e3f6e8; color: #198754; font-size: 42px; font-weight: bold; }
    #modalDetail { font-size: 20px; font-weight: bold; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .orientation-hint { display: none; text-align: center; font-size: 13px; color: #536378; padding: 8px; }
    @media (orientation: portrait) and (max-width: 900px) { .orientation-hint { display: block; } }
    @media (max-width: 600px) {
      header { padding: 16px 110px 16px 12px; text-align: left; font-size: 13px; }
    }
    @media (max-height: 480px) {
      header { padding-top: 8px; padding-bottom: 8px; }
      .orientation-hint { display: none; }
      .modal { padding: 12px; }
      .modal h2, .modal p { margin: 4px 0; }
      .actions { margin-top: 8px; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      #standby h1, #standby > p:not(.error) { display: none; }
      #reader { width: min(100%, calc((100dvh - 75px) * 1.33)); max-height: calc(100dvh - 75px); margin: 0 auto; }
      #reader video { max-height: calc(100dvh - 75px); }
      #status.error { margin: 4px 0; font-size: 13px; }
      .success-icon { width: 36px; height: 36px; margin-bottom: 4px; font-size: 26px; }
      .result-qr { width: min(150px, 28vh); margin: 4px auto; padding: 6px; }
      #modalDetail { font-size: 15px; }
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    SIMULASI PEMILIHAN KEPALA DESA
    <button id="fullscreen" class="fullscreen" type="button" hidden>LAYAR PENUH</button>
  </header>
  <div class="orientation-hint">Putar perangkat ke posisi landscape untuk tampilan terbaik.</div>
  <main>
    <section id="standby" class="panel">
      <h1>STANDBY SCAN</h1>
      <p>Arahkan kamera ke QR Code untuk memulai pemilihan.</p>
      <div id="reader"></div>
      <p id="status" role="status">Menyiapkan kamera...</p>
      <button id="retryCamera" type="button" hidden>COBA LAGI</button>
    </section>
    <section id="voting" class="panel" hidden>
      <h1 id="title"></h1>
      <p>Silakan pilih salah satu kandidat.</p>
      <div id="candidates" class="candidates"></div>
      <button id="choose" type="button" disabled>PILIH KANDIDAT INI</button>
    </section>
  </main>
  <div id="modal" class="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div id="successIcon" class="success-icon" aria-hidden="true" hidden>✓</div>
      <h2 id="modalTitle"></h2>
      <p id="modalMessage"></p>
      <div id="modalPhoto" class="modal-photo" hidden></div>
      <div id="resultQr" class="result-qr" role="img" hidden></div>
      <p id="modalDetail"></p>
      <div id="modalActions" class="actions">
        <button id="cancel" class="secondary" type="button">ULANGI</button>
        <button id="confirm" type="button">PILIH</button>
      </div>
      <button id="resultBack" class="secondary" type="button" hidden>KEMBALI KE SCANNER</button>
    </div>
  </div>
  <script>
    'use strict';
    const simulationData = {
      title: 'Simulasi Pemilihan Kepala Desa',
      candidates: [
        { noUrut: '1', nama: '', fotoUrl: '' },
        { noUrut: '2', nama: 'AGUS SETIAWAN', fotoUrl: 'https://drive.google.com/file/d/1NNnrFCS5ZtKFNSyam2wOgMFeUeXbUrq0/view?usp=sharing' }
        // { noUrut: '3', nama: '', fotoUrl: '' }
      ]
    };
    const standby = document.getElementById('standby');
    const voting = document.getElementById('voting');
    const status = document.getElementById('status');
    const retryCamera = document.getElementById('retryCamera');
    const modal = document.getElementById('modal');
    const choose = document.getElementById('choose');
    const fullscreen = document.getElementById('fullscreen');
    let scanner = null;
    let running = false;
    let busy = false;
    let generation = 0;
    let selected = null;

    function setStatus(message, isError) {
      status.textContent = message;
      status.className = isError ? 'error' : '';
    }

    async function startScanner() {
      if (busy || running) return;
      if (typeof Html5Qrcode === 'undefined') {
        setStatus('Library scanner tidak termuat. Periksa koneksi internet dan muat ulang halaman.', true);
        retryCamera.hidden = false;
        return;
      }
      if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('Kamera memerlukan browser yang mendukung akses kamera dan halaman HTTPS.', true);
        retryCamera.hidden = false;
        return;
      }
      busy = true;
      retryCamera.hidden = true;
      setStatus('Meminta akses kamera...', false);
      const current = ++generation;
      try {
        scanner = new Html5Qrcode('reader');
        await scanner.start({ facingMode: 'environment' }, { fps: 10 }, onScan, function() {});
        running = true;
        if (current !== generation) {
          await scanner.stop();
          running = false;
          scanner = null;
        } else {
          setStatus('Kamera aktif. Arahkan ke QR Code.', false);
        }
      } catch (error) {
        console.error('Kamera gagal dimulai:', error);
        scanner = null;
        running = false;
        setStatus('Kamera tidak dapat dibuka. Izinkan kamera di browser dan pengaturan perangkat, lalu coba lagi.', true);
        retryCamera.hidden = false;
      } finally {
        busy = false;
      }
    }

    async function onScan() {
      if (busy || !running) return;
      busy = true;
      ++generation;
      setStatus('QR terdeteksi. Memuat kandidat...', false);
      try {
        await scanner.stop();
        running = false;
        scanner = null;
        showCandidates(simulationData);
      } catch (error) {
        console.error('Gagal memulai pemilihan:', error);
        setStatus(error.message || 'Gagal memulai pemilihan.', true);
        retryCamera.hidden = false;
      } finally {
        busy = false;
      }
    }

    function showCandidates(data) {
      standby.hidden = true;
      voting.hidden = false;
      document.getElementById('title').textContent = data.title || 'Simulasi Pemilihan Kepala Desa';
      const grid = document.getElementById('candidates');
      grid.replaceChildren();
      updateCandidateLayout(data.candidates.length);
      selected = null;
      choose.disabled = true;
      if (!data.candidates.length) {
        grid.textContent = 'Tidak ada kandidat aktif.';
        return;
      }
      data.candidates.forEach(function(candidate) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'candidate';
        const number = document.createElement('strong');
        number.className = 'candidate-number';
        number.textContent = candidate.noUrut;
        const name = document.createElement('strong');
        name.className = 'candidate-name';
        name.textContent = candidate.nama;
        button.setAttribute('aria-pressed', 'false');
        button.append(number, createCandidatePhoto(candidate), name);
        button.addEventListener('click', function() {
          grid.querySelectorAll('.candidate').forEach(function(item) {
            item.classList.remove('selected');
            item.setAttribute('aria-pressed', 'false');
          });
          button.classList.add('selected');
          button.setAttribute('aria-pressed', 'true');
          selected = candidate;
          choose.disabled = false;
        });
        grid.appendChild(button);
      });
    }

    function updateCandidateLayout(count) {
      if (!count) return;
      const columns = Math.min(count, Math.max(1, Math.ceil(Math.sqrt(count * window.innerWidth / window.innerHeight))));
      const rows = Math.ceil(count / columns);
      const grid = document.getElementById('candidates');
      grid.style.setProperty('--columns', columns);
      grid.style.setProperty('--rows', rows);
      grid.style.maxWidth = (columns * Math.min(300, window.innerHeight * 0.34) + (columns - 1) * 12) + 'px';
      grid.style.setProperty('--grid-max-height', (rows * 400 + (rows - 1) * 16) + 'px');
    }

    function candidatePhotoUrl(url) {
      try {
        const parsed = new URL(url, document.baseURI);
        if (parsed.hostname === 'drive.google.com') {
          const match = parsed.pathname.match(/^\/file\/d\/([a-zA-Z0-9_-]+)/);
          const id = match ? match[1] : parsed.searchParams.get('id');
          if (id && /^[a-zA-Z0-9_-]+$/.test(id)) {
            return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w1000';
          }
        }
      } catch (error) {
        console.error('Alamat foto tidak valid:', error);
      }
      return url;
    }

    function createCandidatePhoto(candidate) {
      function placeholder() {
        const element = document.createElement('span');
        element.className = 'placeholder';
        element.textContent = 'FOTO TIDAK TERSEDIA';
        return element;
      }
      if (!candidate.fotoUrl) return placeholder();
      const photo = document.createElement('img');
      photo.className = 'candidate-photo';
      photo.alt = 'Foto ' + candidate.nama;
      photo.addEventListener('error', function() {
        console.error('Foto kandidat gagal dimuat:', candidate.fotoUrl);
        photo.replaceWith(placeholder());
      });
      photo.src = candidatePhotoUrl(candidate.fotoUrl);
      return photo;
    }

    function returnToStandby() {
      modal.hidden = true;
      voting.hidden = true;
      standby.hidden = false;
      selected = null;
      startScanner();
    }

    retryCamera.addEventListener('click', function() {
      if (running) {
        onScan();
      } else {
        startScanner();
      }
    });
    window.addEventListener('resize', function() {
      updateCandidateLayout(simulationData.candidates.length);
    });
    choose.addEventListener('click', function() {
      if (!selected) return;
      document.getElementById('modalTitle').textContent = 'Konfirmasi Pemilihan';
      document.getElementById('modalMessage').textContent = 'Apakah Anda yakin memilih kandidat ini?';
      document.getElementById('successIcon').hidden = true;
      document.getElementById('resultQr').hidden = true;
      document.getElementById('resultBack').hidden = true;
      const modalPhoto = document.getElementById('modalPhoto');
      modalPhoto.replaceChildren(createCandidatePhoto(selected));
      modalPhoto.hidden = false;
      document.getElementById('modalDetail').textContent = 'No. ' + selected.noUrut + ' - ' + selected.nama;
      document.getElementById('modalActions').hidden = false;
      modal.hidden = false;
      document.getElementById('cancel').focus();
    });
    document.getElementById('cancel').addEventListener('click', function() {
      modal.hidden = true;
      choose.focus();
    });
    document.getElementById('confirm').addEventListener('click', function() {
      if (!selected) return;
      const number = String(selected.noUrut);
      selected = null;
      document.getElementById('successIcon').hidden = false;
      document.getElementById('modalTitle').textContent = 'Terima kasih sudah memilih';
      document.getElementById('modalMessage').textContent = 'Simulasi pemilihan berhasil.';
      document.getElementById('modalPhoto').hidden = true;
      document.getElementById('modalActions').hidden = true;
      const resultQr = document.getElementById('resultQr');
      resultQr.replaceChildren();
      try {
        if (typeof QRCode === 'undefined') {
          throw new Error('Library pembuat QR tidak tersedia.');
        }
        new QRCode(resultQr, { text: number, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
        resultQr.setAttribute('aria-label', 'QR nomor kandidat ' + number);
        resultQr.hidden = false;
        document.getElementById('modalDetail').textContent = 'Simulasi QR kandidat ' + number + '. Kembali ke scanner dalam 5 detik.';
        setTimeout(returnToStandby, 5000);
      } catch (error) {
        console.error('Gagal membuat QR hasil:', error);
        resultQr.hidden = true;
        document.getElementById('modalDetail').textContent = 'QR hasil tidak dapat dibuat. Periksa koneksi internet dan muat ulang halaman.';
        document.getElementById('resultBack').hidden = false;
      }
    });
    document.getElementById('resultBack').addEventListener('click', returnToStandby);
    if (document.fullscreenEnabled && document.documentElement.requestFullscreen) {
      fullscreen.hidden = false;
      fullscreen.addEventListener('click', async function() {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else {
            await document.documentElement.requestFullscreen();
          }
        } catch (error) {
          console.error('Layar penuh gagal:', error);
          alert('Layar penuh tidak dapat diaktifkan. Gunakan mode layar penuh pada browser jika tersedia.');
        }
      });
      document.addEventListener('fullscreenchange', function() {
        fullscreen.textContent = document.fullscreenElement ? 'KELUAR LAYAR PENUH' : 'LAYAR PENUH';
      });
    }
    document.addEventListener('DOMContentLoaded', startScanner);
  </script>
</body>
</html>
