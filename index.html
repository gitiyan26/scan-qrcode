<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulasi Pemilihan Kepala Desa</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8" defer></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; font-family: Arial, sans-serif; background: #eef4fa; color: #17243b; }
    header { position: relative; background: #0b3c95; color: white; padding: 16px 140px; text-align: center; font-weight: bold; letter-spacing: .04em; }
    main { width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; padding: clamp(12px, 2vh, 30px) clamp(16px, 3vw, 36px); }
    .panel { width: min(100%, 1200px); text-align: center; }
    h1 { color: #0b3c95; margin: 0 0 8px; font-size: clamp(24px, 3.2vw, 38px); text-transform: uppercase; }
    .panel > p { margin: 0; color: #536378; }
    #reader { width: min(100%, 520px); margin: 20px auto; overflow: hidden; border-radius: 12px; background: #e2e8f0; }
    #status { line-height: 1.5; margin: 14px 0; }
    .error { color: #b02a37; }
    button { border: 0; border-radius: 8px; padding: 13px 20px; font-size: 16px; font-weight: bold; cursor: pointer; background: #0b3c95; color: white; }
    button:focus-visible { outline: 3px solid #f4a926; outline-offset: 3px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .secondary { background: #52647a; }
    .fullscreen { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); padding: 8px 12px; font-size: 12px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.55); }
    .candidates { display: flex; justify-content: center; flex-wrap: wrap; gap: clamp(10px, 2vw, 20px); margin: clamp(16px, 3vh, 30px) 0; }
    .candidate { display: flex; flex-direction: column; width: clamp(120px, min(18vw, (100dvh - 415px) * .8), 210px); padding: 0; overflow: hidden; background: white; color: #17243b; border: 3px solid #293a4f; border-radius: 4px; box-shadow: 0 5px 15px rgba(24,43,66,.1); }
    .candidate.selected { border-color: #198754; box-shadow: 0 0 0 4px rgba(25,135,84,.2); }
    .candidate-number { width: 100%; padding: 6px; font-size: clamp(20px, 2.4vw, 28px); border-bottom: 2px solid #293a4f; }
    .candidate-photo, .placeholder { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: #e0e7ef; }
    .placeholder { display: grid; place-items: center; color: #64748b; font-size: 14px; }
    .candidate-name { width: 100%; min-height: 48px; display: grid; place-items: center; padding: 8px; border-top: 2px solid #293a4f; overflow-wrap: anywhere; }
    #choose { width: min(100%, 640px); background: #bd2735; }
    .overlay { position: fixed; inset: 0; background: rgba(10,22,40,.72); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
    .modal { background: white; border-radius: 16px; padding: clamp(18px, 3vh, 28px); max-width: 480px; width: 100%; max-height: calc(100dvh - 32px); overflow-y: auto; text-align: center; box-shadow: 0 18px 60px rgba(0,0,0,.25); }
    .modal h2 { margin: 0 0 8px; color: #0b3c95; }
    .modal p { margin: 10px 0; }
    .modal-photo { width: min(180px, 28vh); margin: 12px auto; border: 2px solid #dce3ed; border-radius: 8px; overflow: hidden; }
    .modal-photo .candidate-photo, .modal-photo .placeholder { aspect-ratio: 4 / 5; }
    #modalDetail { font-size: 20px; font-weight: bold; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .orientation-hint { display: none; text-align: center; font-size: 13px; color: #536378; padding: 8px; }
    @media (orientation: portrait) and (max-width: 900px) { .orientation-hint { display: block; } }
    @media (max-width: 600px) {
      header { padding: 16px 110px 16px 12px; text-align: left; font-size: 13px; }
      .candidate { width: min(42%, 180px); }
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    SIMULASI PEMILIHAN KEPALA DESA
    <button id="fullscreen" class="fullscreen" type="button" hidden>LAYAR PENUH</button>
  </header>
  <div class="orientation-hint">Putar perangkat ke posisi landscape untuk tampilan terbaik.</div>
  <main>
    <section id="standby" class="panel">
      <h1>STANDBY SCAN</h1>
      <p>Arahkan kamera ke QR Code untuk memulai pemilihan.</p>
      <div id="reader"></div>
      <p id="status" role="status">Menyiapkan kamera...</p>
      <button id="retryCamera" type="button" hidden>COBA LAGI</button>
    </section>
    <section id="voting" class="panel" hidden>
      <h1 id="title"></h1>
      <p>Silakan pilih salah satu kandidat.</p>
      <div id="candidates" class="candidates"></div>
      <button id="choose" type="button" disabled>PILIH KANDIDAT INI</button>
      <div class="actions"><button id="back" class="secondary" type="button">KEMBALI KE SCAN</button></div>
    </section>
  </main>
  <div id="modal" class="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <p id="modalMessage"></p>
      <div id="modalPhoto" class="modal-photo" hidden></div>
      <p id="modalDetail"></p>
      <div id="modalActions" class="actions">
        <button id="cancel" class="secondary" type="button">ULANGI</button>
        <button id="confirm" type="button">PILIH</button>
      </div>
    </div>
  </div>
  <script>
    'use strict';
    const simulationData = {
      title: 'Simulasi Pemilihan Kepala Desa',
      candidates: [
        { noUrut: '1', nama: 'Kandidat 1', fotoUrl: '' },
        { noUrut: '2', nama: 'Kandidat 2', fotoUrl: '' },
        { noUrut: '3', nama: 'Kandidat 3', fotoUrl: '' }
      ]
    };
    const standby = document.getElementById('standby');
    const voting = document.getElementById('voting');
    const status = document.getElementById('status');
    const retryCamera = document.getElementById('retryCamera');
    const modal = document.getElementById('modal');
    const choose = document.getElementById('choose');
    const fullscreen = document.getElementById('fullscreen');
    let scanner = null;
    let running = false;
    let busy = false;
    let generation = 0;
    let selected = null;

    function setStatus(message, isError) {
      status.textContent = message;
      status.className = isError ? 'error' : '';
    }

    async function startScanner() {
      if (busy || running) return;
      if (typeof Html5Qrcode === 'undefined') {
        setStatus('Library scanner tidak termuat. Periksa koneksi internet dan muat ulang halaman.', true);
        retryCamera.hidden = false;
        return;
      }
      if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('Kamera memerlukan browser yang mendukung akses kamera dan halaman HTTPS.', true);
        retryCamera.hidden = false;
        return;
      }
      busy = true;
      retryCamera.hidden = true;
      setStatus('Meminta akses kamera...', false);
      const current = ++generation;
      try {
        scanner = new Html5Qrcode('reader');
        await scanner.start({ facingMode: 'environment' }, { fps: 10 }, onScan, function() {});
        running = true;
        if (current !== generation) {
          await scanner.stop();
          running = false;
          scanner = null;
        } else {
          setStatus('Kamera aktif. Arahkan ke QR Code.', false);
        }
      } catch (error) {
        console.error('Kamera gagal dimulai:', error);
        scanner = null;
        running = false;
        setStatus('Kamera tidak dapat dibuka. Izinkan kamera di browser dan pengaturan perangkat, lalu coba lagi.', true);
        retryCamera.hidden = false;
      } finally {
        busy = false;
      }
    }

    async function onScan() {
      if (busy || !running) return;
      busy = true;
      ++generation;
      setStatus('QR terdeteksi. Memuat kandidat...', false);
      try {
        await scanner.stop();
        running = false;
        scanner = null;
        showCandidates(simulationData);
      } catch (error) {
        console.error('Gagal memulai pemilihan:', error);
        setStatus(error.message || 'Gagal memulai pemilihan.', true);
        retryCamera.hidden = false;
      } finally {
        busy = false;
      }
    }

    function showCandidates(data) {
      standby.hidden = true;
      voting.hidden = false;
      document.getElementById('title').textContent = data.title || 'Simulasi Pemilihan Kepala Desa';
      const grid = document.getElementById('candidates');
      grid.replaceChildren();
      selected = null;
      choose.disabled = true;
      if (!data.candidates.length) {
        grid.textContent = 'Tidak ada kandidat aktif.';
        return;
      }
      data.candidates.forEach(function(candidate) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'candidate';
        const number = document.createElement('strong');
        number.className = 'candidate-number';
        number.textContent = candidate.noUrut;
        const name = document.createElement('strong');
        name.className = 'candidate-name';
        name.textContent = candidate.nama;
        button.setAttribute('aria-pressed', 'false');
        button.append(number, createCandidatePhoto(candidate), name);
        button.addEventListener('click', function() {
          grid.querySelectorAll('.candidate').forEach(function(item) {
            item.classList.remove('selected');
            item.setAttribute('aria-pressed', 'false');
          });
          button.classList.add('selected');
          button.setAttribute('aria-pressed', 'true');
          selected = candidate;
          choose.disabled = false;
        });
        grid.appendChild(button);
      });
    }

    function createCandidatePhoto(candidate) {
      function placeholder() {
        const element = document.createElement('span');
        element.className = 'placeholder';
        element.textContent = 'FOTO TIDAK TERSEDIA';
        return element;
      }
      if (!candidate.fotoUrl) return placeholder();
      const photo = document.createElement('img');
      photo.className = 'candidate-photo';
      photo.alt = 'Foto ' + candidate.nama;
      photo.addEventListener('error', function() {
        console.error('Foto kandidat gagal dimuat:', candidate.fotoUrl);
        photo.replaceWith(placeholder());
      });
      photo.src = candidate.fotoUrl;
      return photo;
    }

    function returnToStandby() {
      modal.hidden = true;
      voting.hidden = true;
      standby.hidden = false;
      selected = null;
      startScanner();
    }

    retryCamera.addEventListener('click', function() {
      if (running) {
        onScan();
      } else {
        startScanner();
      }
    });
    document.getElementById('back').addEventListener('click', returnToStandby);
    choose.addEventListener('click', function() {
      if (!selected) return;
      document.getElementById('modalTitle').textContent = 'Konfirmasi Pemilihan';
      document.getElementById('modalMessage').textContent = 'Apakah Anda yakin memilih kandidat ini?';
      const modalPhoto = document.getElementById('modalPhoto');
      modalPhoto.replaceChildren(createCandidatePhoto(selected));
      modalPhoto.hidden = false;
      document.getElementById('modalDetail').textContent = 'No. ' + selected.noUrut + ' - ' + selected.nama;
      document.getElementById('modalActions').hidden = false;
      modal.hidden = false;
      document.getElementById('cancel').focus();
    });
    document.getElementById('cancel').addEventListener('click', function() {
      modal.hidden = true;
      choose.focus();
    });
    document.getElementById('confirm').addEventListener('click', function() {
      if (!selected) return;
      selected = null;
      document.getElementById('modalTitle').textContent = 'Terima kasih sudah memilih';
      document.getElementById('modalMessage').textContent = 'Simulasi pemilihan berhasil.';
      document.getElementById('modalPhoto').hidden = true;
      document.getElementById('modalDetail').textContent = 'Ini hanya simulasi; pilihan tidak disimpan. Kembali ke scanner dalam 5 detik.';
      document.getElementById('modalActions').hidden = true;
      setTimeout(returnToStandby, 5000);
    });
    if (document.fullscreenEnabled && document.documentElement.requestFullscreen) {
      fullscreen.hidden = false;
      fullscreen.addEventListener('click', async function() {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else {
            await document.documentElement.requestFullscreen();
          }
        } catch (error) {
          console.error('Layar penuh gagal:', error);
          alert('Layar penuh tidak dapat diaktifkan. Gunakan mode layar penuh pada browser jika tersedia.');
        }
      });
      document.addEventListener('fullscreenchange', function() {
        fullscreen.textContent = document.fullscreenElement ? 'KELUAR LAYAR PENUH' : 'LAYAR PENUH';
      });
    }
    document.addEventListener('DOMContentLoaded', startScanner);
  </script>
</body>
</html>
